<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -55 510 510">
  <title>Exira</title>
  <!--
    A favicon, not the logo shrunk.

    The full mark carries four layers separated by 1.25-1.5px strokes and a
    1.2px dot pattern on a 462-unit canvas. At 16px those are roughly a
    twentieth of a pixel: the strokes vanish, the dots turn to noise, and
    the four layers merge into one blob. The old file also used the logo's
    493x464 viewBox, so a square tab slot letterboxed it and pushed the
    mark off centre.

    So: square viewBox with the mark centred in it, three layers instead of
    four, spaced 100 units apart instead of 74, and separated by tone
    rather than by hairline. The three fills stay distinct all the way down
    to 16px, which is the only size that matters here.

    The full four-layer mark is unchanged and still lives in
    components/Sprite.tsx for the header, footer and report card.
  -->
  <defs>
    <linearGradient id="fvTop" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06307C"/>
      <stop offset="30%" stop-color="#0B3785"/>
      <stop offset="55%" stop-color="#234D9E"/>
      <stop offset="78%" stop-color="#426EB7"/>
      <stop offset="100%" stop-color="#6F92D7"/>
    </linearGradient>
    <path id="fvLayer" d="M 237.42 2.78 L 455.58 97.22 Q 462.00 100.00 455.58 102.78 L 237.42 197.22 Q 231.00 200.00 224.58 197.22 L 6.42 102.78 Q 0.00 100.00 6.42 97.22 L 224.58 2.78 Q 231.00 0.00 237.42 2.78 Z"/>
  </defs>

  <use href="#fvLayer" transform="translate(0 200)" fill="#DDE4F0" stroke="#FFFFFF" stroke-width="9"/>
  <use href="#fvLayer" transform="translate(0 100)" fill="#C3CFE4" stroke="#FFFFFF" stroke-width="9"/>
  <use href="#fvLayer" fill="url(#fvTop)" stroke="#FFFFFF" stroke-width="9"/>
</svg>
